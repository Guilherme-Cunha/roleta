<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=5.0">
   <meta name="robots" content="index, follow">
   <meta name="google-site-verification" content="-O_mVgoZhh3Gu5EPZhUriaC60GraJK6rf-ABrgYb4c4" />
   <!-- Cross-Origin Isolation --> 
   <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
   <!-- HSTS --> 
   <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload">
   <!-- SEO Básico --> 
   <meta name="description" content="Gire a roleta de nomes online de forma rápida e divertida. Ideal para sorteios entre amigos, grupos ou eventos.">
   <meta name="keywords" content="roleta de nomes, sorteio online, roleta grátis, sorteio de amigos, roleta interativa, sorteio de grupo, roleta personalizada, sorteio divertido, roleta aleatória, roleta para eventos">
   <meta name="author" content="Guilherme Cunha" />
   <!-- Open Graph (Facebook, LinkedIn, WhatsApp) --> 
   <meta property="og:title" content="Roleta de Nomes - Sorteios Online" />
   <meta property="og:description" content="Use esta roleta interativa para realizar sorteios de forma divertida e prática." />
   <meta property="og:type" content="website" />
   <meta property="og:url" content="https://guilherme-cunha.github.io/roleta/" />
   <meta property="og:image" content="https://guilherme-cunha.github.io/roleta/imagens/thumbnail.png" />
   <!-- Twitter Card --> 
   <meta name="twitter:card" content="summary_large_image" />
   <meta name="twitter:title" content="Roleta de Nomes - Sorteios Online" />
   <meta name="twitter:description" content="Sorteios rápidos e divertidos com a Roleta de Nomes online." />
   <meta name="twitter:image" content="https://guilherme-cunha.github.io/roleta/imagens/thumbnail.png" />
   <meta name="twitter:creator" content="@guicunha1188" />
   <title>Roleta de Nomes - Ao Vivo</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="style.css">
   <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <canvas id="matrixCanvas"></canvas>
  <canvas id="fireworksCanvas"></canvas>
  <div class="crt-overlay" aria-hidden="true"></div>
  <div id="hackingContainer" aria-hidden="true"></div>

  <audio id="sound" src="https://cdn.pixabay.com/audio/2023/04/13/audio_f4865f179c.mp3"></audio>
  <audio id="rocketSound" src="https://cdn.pixabay.com/audio/2025/05/03/audio_5a28c4570f.mp3"></audio>
  <audio id="explosionSound" src="https://cdn.pixabay.com/audio/2025/05/31/audio_be1e4daf3e.mp3"></audio>

  <div class="container">
    <div id="inputArea">
      <textarea id="names" placeholder="Digite os nomes separados por vírgula ou por enter" spellcheck="false"></textarea>
      <button id="openConfig" class="gerar-btn" title="Configure sua roleta.">⚙️</button>
      <button id="shareViewerBtn" class="link-btn" title="Copiar link para espectadores" style="margin-left: 8px;">🔗 Link Espectador</button>
    </div>
    <div id="wheelContainer">
      <canvas id="wheel" width="605" height="605"></canvas>
      <button id="spinBtn" onclick="girarAoVivo()" style="display:none;" title="Gire para sortear o próximo.">Clique para Girar</button>
      
      <!-- BONEQUINHO (palitinho em SVG) -->
      <div class="boneco" id="boneco" aria-hidden="true">
        <svg viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
          <!-- cabeça -->
          <circle cx="50" cy="30" r="20" stroke="white" stroke-width="4" fill="none"/>
          <!-- corpo -->
          <line x1="50" y1="50" x2="50" y2="120" stroke="white" stroke-width="4"/>
          <!-- braços -->
          <line x1="50" y1="70" x2="20" y2="90" stroke="white" stroke-width="4"/>
          <line id="braco" x1="50" y1="70" x2="80" y2="90" stroke="white" stroke-width="4"/>
          <!-- pernas -->
          <line id="perna-esquerda" x1="50" y1="120" x2="20" y2="170" stroke="white" stroke-width="4"/>
          <line id="perna-direita" x1="50" y1="120" x2="80" y2="170" stroke="white" stroke-width="4"/>
        </svg>
      </div>
      <div id="pointer"></div>
    </div>
  </div>

  <div id="modal">
    <div id="modalContent">
      <div id="winner"></div>
      <button id="okBtn">OK</button>
    </div>
  </div>

  <!-- BONECO VOADOR — aparece cruzando a tela enquanto o vencedor é exibido -->
  <div class="boneco-voador" id="bonecoVoador" aria-hidden="true">
    <svg viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="30" r="20" stroke="white" stroke-width="4" fill="none"/>
      <line x1="50" y1="50" x2="50" y2="120" stroke="white" stroke-width="4"/>
      <line x1="50" y1="70" x2="20" y2="90" stroke="white" stroke-width="4"/>
      <line x1="50" y1="70" x2="80" y2="90" stroke="white" stroke-width="4"/>
      <line x1="50" y1="120" x2="20" y2="170" stroke="white" stroke-width="4"/>
      <line x1="50" y1="120" x2="80" y2="170" stroke="white" stroke-width="4"/>
    </svg>
  </div>

  <div id="result"></div>
  <div class="toast-container" id="toastContainer"></div>
  <div id="speechTimer" style="display: none;">00:00</div>

  <!-- Modal de Configurações -->
  <div id="configModal" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close" title="Fechar">&times;</span>
      <h2>Configurações</h2>
      <label for="fireworksCount">Quantidade de foguetes:</label><br>
      <input type="number" id="fireworksCount" min="1" max="20" value="5"><br><br>

      <label for="spinTime">Tempo da roleta (em segundos):</label>
      <input type="number" id="spinTime" min="1" max="60" value="10"><br><br>

      <label>
        <input type="checkbox" id="toggleSpeechTimer">
        Mostrar timer
      </label>
      <br><br>

      <button id="saveConfig" class="btn-save-config">Salvar Configurações</button>
    </div>
  </div>

  <!-- Integração Firebase + Lógica Realtime Anfitrião/Espectador -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCdnTHJPV1Ce0T4wVVF9Lhy1yOmM8YHfwU",
      authDomain: "piloto-1526f.firebaseapp.com",
      databaseURL: "https://piloto-1526f.firebaseio.com",
      projectId: "piloto-1526f",
      storageBucket: "piloto-1526f.firebasestorage.app",
      messagingSenderId: "746437052107",
      appId: "1:746437052107:web:bb80ce75617bd321a2fd4e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const isViewer = urlParams.get('role') === 'viewer';

    // Regista o momento em que a página abriu para ignorar giros antigos
    const pageLoadTime = Date.now();

    window.addEventListener('DOMContentLoaded', () => {
      const inputArea = document.getElementById('inputArea');
      const spinBtn = document.getElementById('spinBtn');
      const shareBtn = document.getElementById('shareViewerBtn');
      const namesTextarea = document.getElementById('names');

      if (isViewer) {
        if (inputArea) inputArea.style.display = 'none';
        if (spinBtn) spinBtn.style.display = 'none';
      } else {
        if (shareBtn) {
          shareBtn.addEventListener('click', () => {
            const viewerUrl = `${window.location.origin}${window.location.pathname}?role=viewer`;
            navigator.clipboard.writeText(viewerUrl).then(() => {
              alert("Link de Espectador copiado! Envia para quem vai assistir.");
            });
          });
        }

        // ANFITRIÃO: Envia os nomes para o Firebase e atualiza a roleta local ao digitar
         if (namesTextarea) {
           namesTextarea.addEventListener('input', () => {
             const textoNomes = namesTextarea.value;
             
             // Atualiza a roleta local do anfitrião e exibe o botão
             if (typeof window.setupWheel === 'function') {
               window.setupWheel(textoNomes, true);
             }
   
             // Envia a atualização para os espectadores
             set(ref(db, 'roleta/nomes'), textoNomes);
           });
         }
      }
    });

    // Ouve alterações nos nomes
    const nomesRef = ref(db, 'roleta/nomes');
    onValue(nomesRef, (snapshot) => {
      const textoNomes = snapshot.val();
      
      if (textoNomes && typeof window.setupWheel === 'function') {
        window.setupWheel(textoNomes, true);
      } else if (textoNomes === '') {
        // Se a lista for limpa pelo anfitrião, limpa nos espectadores também
        const namesTextarea = document.getElementById('names');
        if (namesTextarea) namesTextarea.value = '';
        if (typeof window.setupWheel === 'function') {
          window.setupWheel('', true);
        }
      }
    });

    // Ouve giros em tempo real
    const roletaRef = ref(db, 'roleta/estado');
    onValue(roletaRef, (snapshot) => {
      const data = snapshot.val();
      
      // Só executa o giro se ele foi disparado APÓS o carregamento da página
      if (data && data.emAndamento && data.startTime >= (pageLoadTime - 2000)) {
        if (typeof window.animarRoletaSincronizada === 'function') {
          window.animarRoletaSincronizada(data.targetRotation, data.startTime, data.duration);
        } else if (isViewer && typeof window.spin === 'function') {
          window.spin();
        }
      }
    });

    // Função para resetar o estado ativo no Firebase
    window.resetarEstadoGiroFirebase = function() {
      set(ref(db, 'roleta/estado'), {
        emAndamento: false,
        startTime: 0,
        targetRotation: 0,
        duration: 0
      });
    };

    // Função global acionada pelo Anfitrião ao girar
    window.girarAoVivo = function() {
      if (isViewer) return;

      if (typeof window.spin === 'function') {
        window.spin();
      }

      const duracao = parseInt(localStorage.getItem("spinTime")) || 10000;
      const voltasExtras = (5 + Math.floor(Math.random() * 5)) * 360;
      const anguloSorteado = Math.floor(Math.random() * 360);
      const anguloFinal = (voltasExtras + anguloSorteado) * (Math.PI / 180);

      set(ref(db, 'roleta/estado'), {
        emAndamento: true,
        startTime: Date.now(),
        targetRotation: anguloFinal,
        duration: duracao
      });
    };
  </script>

  <script src="script.js"></script>
</body>
</html>
