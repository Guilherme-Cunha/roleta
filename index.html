<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0">
   <meta name="robots" content="index, follow">
   <meta name="google-site-verification" content="-O_mVgoZhh3Gu5EPZhUriaC60GraJK6rf-ABrgYb4c4" />
   <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
   <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload">
   <meta name="description" content="Gire a roleta de nomes online de forma rápida e divertida. Ideal para sorteios entre amigos, grupos ou eventos.">
   <meta name="keywords" content="roleta de nomes, sorteio online, roleta grátis, sorteio de amigos, roleta interativa, sorteio de grupo, roleta personalizada, sorteio divertido, roleta aleatória, roleta para eventos">
   <meta name="author" content="Guilherme Cunha" />
   <meta property="og:title" content="Roleta de Nomes - Sorteios Online" />
   <meta property="og:description" content="Use esta roleta interativa para realizar sorteios de forma divertida e prática." />
   <meta property="og:type" content="website" />
   <meta property="og:url" content="https://guilherme-cunha.github.io/roleta/" />
   <meta property="og:image" content="https://guilherme-cunha.github.io/roleta/imagens/thumbnail.png" />
   <meta name="twitter:card" content="summary_large_image" />
   <meta name="twitter:title" content="Roleta de Nomes - Sorteios Online" />
   <meta name="twitter:description" content="Sorteios rápidos e divertidos com a Roleta de Nomes online." />
   <meta name="twitter:image" content="https://guilherme-cunha.github.io/roleta/imagens/thumbnail.png" />
   <meta name="twitter:creator" content="@guicunha1188" />
   <title>Roleta de Nomes - Ao Vivo</title>
   <link rel="stylesheet" href="style.css">
   <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <canvas id="matrixCanvas"></canvas>
  <canvas id="fireworksCanvas"></canvas>
  <div class="crt-overlay" aria-hidden="true"></div>
  <div id="hackingContainer" aria-hidden="true"></div>
  <div id="efeitos" aria-hidden="true"></div>

  <audio id="sound" preload="auto" src="https://cdn.pixabay.com/audio/2023/04/13/audio_f4865f179c.mp3"></audio>
  <audio id="rocketSound" preload="auto" src="https://cdn.pixabay.com/audio/2025/05/03/audio_5a28c4570f.mp3"></audio>
  <audio id="explosionSound" preload="auto" src="https://cdn.pixabay.com/audio/2025/05/31/audio_be1e4daf3e.mp3"></audio>

  <div class="container">
    <div id="inputArea">
      <textarea id="names" placeholder="Digite os nomes separados por vírgula ou por enter" spellcheck="false" maxlength="5000"></textarea>
      <div class="input-actions">
        <button id="openConfig" class="gerar-btn" title="Configure sua roleta.">⚙️</button>
        <button id="shareViewerBtn" class="link-btn" title="Copiar link para espectadores">🔗 Link Espectador</button>
      </div>
    </div>
    <div id="wheelContainer">
      <canvas id="wheel" width="605" height="605"></canvas>
      <button id="spinBtn" style="display:none;" title="Gire para sortear o próximo.">Clique para Girar</button>
      
      <!-- BONEQUINHO (palitinho em SVG) -->
      <div class="boneco" id="boneco" aria-hidden="true">
        <svg viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
          <g id="perna-esquerda">
            <line x1="44" y1="118" x2="24" y2="170" stroke="#00ff88" stroke-width="11.5" stroke-linecap="round"/>
            <line x1="44" y1="118" x2="24" y2="170" stroke="#0a0a0a" stroke-width="9.5" stroke-linecap="round"/>
            <ellipse cx="17" cy="176" rx="11" ry="5.5" fill="#000" stroke="#00ff88" stroke-width="1.4"/>
          </g>
          <g id="perna-direita">
            <line x1="56" y1="118" x2="76" y2="170" stroke="#00ff88" stroke-width="11.5" stroke-linecap="round"/>
            <line x1="56" y1="118" x2="76" y2="170" stroke="#0a0a0a" stroke-width="9.5" stroke-linecap="round"/>
            <ellipse cx="83" cy="176" rx="11" ry="5.5" fill="#000" stroke="#00ff88" stroke-width="1.4"/>
          </g>
          <!-- sobretudo: duas abas abertas na frente, com a camisa escura entre elas -->
          <path d="M45 52 L55 52 L54 140 L46 140 Z" fill="#1c1c1c"/>
          <path d="M30 56 Q38 50 47 52 L46 140 L14 140 Q22 112 25 92 Z" fill="#0a0a0a" stroke="#00ff88" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M70 56 Q62 50 53 52 L54 140 L86 140 Q78 112 75 92 Z" fill="#0a0a0a" stroke="#00ff88" stroke-width="1.2" stroke-linejoin="round"/>
          <!-- gola e lapelas -->
          <path d="M34 53 L47 52 L45 72 Z" fill="#0a0a0a" stroke="#00ff88" stroke-width="1" stroke-linejoin="round"/>
          <path d="M66 53 L53 52 L55 72 Z" fill="#0a0a0a" stroke="#00ff88" stroke-width="1" stroke-linejoin="round"/>
          <!-- braço esquerdo (manga contornada + mão) -->
          <line x1="32" y1="60" x2="15" y2="98" stroke="#00ff88" stroke-width="11.5" stroke-linecap="round"/>
          <line x1="32" y1="60" x2="15" y2="98" stroke="#0a0a0a" stroke-width="9.5" stroke-linecap="round"/>
          <circle cx="13" cy="103" r="5.5" fill="#d2ad8a"/>
          <!-- braço direito: é o que empurra a roleta e se ergue na decolagem -->
          <g id="braco">
            <line x1="68" y1="60" x2="85" y2="96" stroke="#00ff88" stroke-width="11.5" stroke-linecap="round"/>
            <line x1="68" y1="60" x2="85" y2="96" stroke="#0a0a0a" stroke-width="9.5" stroke-linecap="round"/>
            <circle cx="87" cy="101" r="5.5" fill="#d2ad8a"/>
          </g>
          <circle id="cabeca" cx="50" cy="30" r="17" fill="#d2ad8a"/>
          <path d="M33 28 Q50 4 67 28 Q50 15 33 28 Z" fill="#111"/>
          <rect x="35" y="26" width="30" height="9" rx="3" fill="#000"/>
          <line x1="39" y1="29" x2="47" y2="29" stroke="#00ff88" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div id="pointer"></div>
    </div>
  </div>

  <div id="modal">
    <div id="modalContent">
      <div id="winnerLabel">&gt; ACESSO CONCEDIDO</div>
      <div id="winner"></div>
      <button id="okBtn">[ OK ]</button>
    </div>
  </div>

  <div class="boneco-voador" id="bonecoVoador" aria-hidden="true">
    <svg viewBox="0 0 220 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M96 42 C70 30 40 30 6 20 C26 38 22 48 4 58 C34 58 62 62 98 64 Z" fill="#0a0a0a" stroke="#00ff88" stroke-width="1.2" stroke-linejoin="round"/>
      <line x1="98" y1="58" x2="50" y2="64" stroke="#0a0a0a" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="42" cy="65" rx="10" ry="5.5" transform="rotate(6 42 65)" fill="#000" stroke="#00ff88" stroke-width="1.4"/>
      <line x1="98" y1="63" x2="50" y2="76" stroke="#0a0a0a" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="42" cy="78" rx="10" ry="5.5" transform="rotate(14 42 78)" fill="#000" stroke="#00ff88" stroke-width="1.4"/>
      <line x1="124" y1="40" x2="99" y2="21" stroke="#0a0a0a" stroke-width="8" stroke-linecap="round"/>
      <circle cx="94" cy="17" r="5.5" fill="#d2ad8a"/>
      <path d="M90 38 Q122 29 152 40 L152 63 Q122 70 90 61 Z" fill="#0a0a0a" stroke="#00ff88" stroke-width="1.2" stroke-linejoin="round"/>
      <line x1="140" y1="54" x2="177" y2="62" stroke="#0a0a0a" stroke-width="8" stroke-linecap="round"/>
      <circle cx="183" cy="63" r="6" fill="#d2ad8a"/>
      <circle cx="163" cy="40" r="13" fill="#d2ad8a"/>
      <path d="M150 38 Q152 24 171 28 Q160 30 160 38 Z" fill="#111"/>
      <rect x="161" y="35" width="16" height="8" rx="3" fill="#000"/>
      <line x1="165" y1="38" x2="171" y2="38" stroke="#00ff88" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </div>

  <div id="result"></div>
  <div class="toast-container" id="toastContainer"></div>
  <div id="timerBox" style="display: none;">
    <div class="timer-linha">
      <span id="speechTimer">00:00</span>
      <button id="timerToggle" class="timer-btn" type="button" title="Iniciar/pausar o timer">▶ Iniciar</button>
    </div>
    <div id="personTimer" style="display: none;">
      <span id="personName"></span>
      <span id="personTime">00:00</span>
    </div>
  </div>

  <!-- Modal de Configurações: janela de terminal com chuva de letras da Matrix -->
  <div id="configModal" class="modal">
    <div class="modal-content">
      <canvas id="configChuva" class="config-chuva" aria-hidden="true"></canvas>
      <div class="config-barra">
        <span class="hack-dot"></span><span class="hack-dot"></span><span class="hack-dot"></span>
        <span class="config-titulo">root@sorteio:~# configurar</span>
        <span id="closeModal" class="close" title="Fechar">&times;</span>
      </div>
      <div class="config-corpo">
        <h2>Configurações</h2>

        <div class="config-campo">
          <label for="fireworksCount">&gt; Quantidade de foguetes:</label>
          <input type="number" id="fireworksCount" min="1" max="20" value="5">
        </div>

        <div class="config-campo">
          <label for="spinTime">&gt; Tempo da roleta (segundos):</label>
          <input type="number" id="spinTime" min="1" max="60" value="10">
        </div>

        <div class="config-campo">
          <label class="config-check">
            <input type="checkbox" id="toggleSpeechTimer" checked>
            &gt; Mostrar timer
          </label>
        </div>

        <button id="saveConfig" class="btn-save-config">[ Salvar configurações ]</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <!-- Sincronização Firebase (anfitrião grava, espectadores só leem) -->
  <script type="module" src="sync.js"></script>
</body>
</html>
